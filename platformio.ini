; =============================================================================
;  Auditor / Interrogador consciente para u-blox NEO-6M-0-001 (ROM 7.03, UBX 13.03)
;  Placa: GY-NEO6MV2 / GY-GPS6MV2   -   MCU: ESP32-S3   -   Framework: ESP-IDF
;
;  Pines (UNICOS permitidos):
;    GPIO4 -> TX ESP32-S3  ->  RX del NEO-6M
;    GPIO5 <- RX ESP32-S3  <-  TX del NEO-6M  (pull-up interno)
;    GPIO6 <- PPS / TIMEPULSE opcional (pull-down interno, flanco de subida)
; =============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform        = espressif32@^6.9.0
board           = esp32-s3-devkitc-1
framework       = espidf

; Monitor serie de la consola estructurada
monitor_speed   = 115200
monitor_filters = direct
monitor_echo    = no

; Flash / carga
upload_speed    = 921600
board_build.flash_mode = dio

; Indicadores de compilacion del proyecto.
; - Las advertencias estrictas (-Wall -Wextra ...) se aplican SOLO a nuestro
;   componente desde src/CMakeLists.txt para no contaminar ESP-IDF.
; - printf con punto flotante: newlib completo (no nano) -> ver sdkconfig.defaults
build_flags =
    -DGPS_FW_NAME=\"NEO6M-AUDITOR\"
    -DGPS_FW_VERSION=\"2.0.0\"
